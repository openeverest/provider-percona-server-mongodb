apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-hidden
spec:
  replsets:
    - name: rs0
      size: 3
      hidden:
        enabled: true
        size: 4
        resources:
          limits:
            cpu: "3"
            memory: 6Gi
        volumeSpec:
          persistentVolumeClaim:
            resources:
              requests:
                storage: 60Gi
