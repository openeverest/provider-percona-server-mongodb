apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-hidden
spec:
  providerRef:
    name: percona-server-mongodb
  topology:
    type: replicaSet
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
      storage:
        size: 25Gi
        storageClass: standard
      parameters:
        configuration: |
          operationProfiling:
            mode: all
    hidden:
      type: mongod
      replicas: 2
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
      storage:
        size: 50Gi
        storageClass: hidden-class
