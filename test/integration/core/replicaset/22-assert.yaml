apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 10
collectors:
  - command: kubectl get in/test-psmdb-cluster -n ${NAMESPACE} -o yaml
  - command: kubectl get psmdb/test-psmdb-cluster -n ${NAMESPACE} -o yaml
resourceRefs:
  - apiVersion: core.openeverest.io/v1alpha1
    kind: Instance
    name: test-psmdb-cluster
    ref: in
  - apiVersion: psmdb.percona.com/v1
    kind: PerconaServerMongoDB
    name: test-psmdb-cluster
    ref: psmdb
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  provider: percona-server-mongodb
  components:
    engine:
      service:
        exposeType: LoadBalancer
        loadBalancerService:
          sourceRanges:
            - "10.0.0.0/8"
            - "192.168.1.100"
          annotations:
            test-annotation: "test-value"
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  replsets:
    - expose:
        enabled: true
        exposeType: LoadBalancer
        serviceAnnotations:
          test-annotation: "test-value"
        loadBalancerSourceRanges:
          - "10.0.0.0/8"
          - "192.168.1.100/32"
status:
  state: ready
