apiVersion: v1
kind: Secret
metadata:
  name: test-psmdb-user-credentials
  labels:
    openeverest.io/provider: percona-server-mongodb
    openeverest.io/definition: user
    openeverest.io/managed: "true"
stringData:
  MONGODB_BACKUP_USER: backup
  MONGODB_BACKUP_PASSWORD: backup-pass
  MONGODB_CLUSTER_ADMIN_USER: clusterAdmin
  MONGODB_CLUSTER_ADMIN_PASSWORD: cluster-admin-pass
  MONGODB_CLUSTER_MONITOR_USER: clusterMonitor
  MONGODB_CLUSTER_MONITOR_PASSWORD: cluster-monitor-pass
  MONGODB_DATABASE_ADMIN_USER: databaseAdmin
  MONGODB_DATABASE_ADMIN_PASSWORD: database-admin-pass
  MONGODB_USER_ADMIN_USER: userAdmin
  MONGODB_USER_ADMIN_PASSWORD: user-admin-pass
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-user-secret
spec:
  providerRef:
    name: percona-server-mongodb
  userSecretRef:
    name: test-psmdb-user-credentials
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
        