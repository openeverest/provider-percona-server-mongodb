---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-replicaset
spec:
  description: |
    Lifecycle of a replica-set Instance: create, scale, affinity and expose
    updates, deletion, seeding credentials, and a single-node cluster.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,psmdb -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mongodb
        tail: 100
  steps:
    - name: provider-operator-installed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-cluster
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Create the users secret and then simulate the PSMDB operator (scaled to
    # 0) marking the cluster ready the way it does: for the latest generation,
    # with a primary in the replica set. The secret is created first because
    # the provider reads it for the connection details as soon as the cluster
    # is ready, and would otherwise fail and retry with a growing delay.
    - name: cluster-ready
      try:
        - apply:
            file: 11-cluster-ready.yaml
        - script:
            content: |
              generation=$(kubectl get psmdb/test-psmdb-cluster -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              kubectl patch psmdb/test-psmdb-cluster --subresource status -n $NAMESPACE --type=merge \
                -p '{"status":{"state":"ready","observedGeneration":'"${generation}"',"size":3,"ready":3,"host":"test-psmdb-cluster-rs0.default.svc.cluster.local","replsets":{"rs0":{"initialized":true,"size":3,"ready":3,"status":"ready","members":{"test-psmdb-cluster-rs0-0":{"name":"test-psmdb-cluster-rs0-0:27017","state":1,"stateStr":"PRIMARY"}}}}}}'
        - assert:
            file: 11-assert.yaml

    # A change is applied to the PerconaServerMongoDB at once, but the
    # Instance is not Ready again until the operator has acted on it.
    - name: scale-cluster
      try:
        - apply:
            file: 20-update-cluster.yaml
        - assert:
            file: 20-assert.yaml

    - name: scale-cluster-observed
      try:
        - script:
            content: |
              generation=$(kubectl get psmdb/test-psmdb-cluster -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              kubectl patch psmdb/test-psmdb-cluster --subresource status -n $NAMESPACE --type=merge \
                -p '{"status":{"observedGeneration":'"${generation}"'}}'
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-psmdb-cluster
              status:
                phase: Provisioned
                (conditions[?type == 'Ready'].status | [0]): "True"

    - name: update-affinity
      try:
        - apply:
            file: 21-update-cluster-affinity.yaml
        - assert:
            file: 21-assert.yaml

    - name: expose-load-balancer
      try:
        - apply:
            file: 22-update-cluster-lb.yaml
        - assert:
            file: 22-assert.yaml

    - name: expose-cluster-ip
      try:
        - apply:
            file: 23-update-cluster-cluster-ip.yaml
        - assert:
            file: 23-assert.yaml

    - name: expose-node-port
      try:
        - apply:
            file: 24-update-cluster-node-port.yaml
        - assert:
            file: 24-assert.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/test-psmdb-cluster psmdb/test-psmdb-cluster --wait=false && sleep 5
              kubectl -n $NAMESPACE delete secret/everest-secrets-test-psmdb-cluster
              kubectl -n $NAMESPACE delete configmap/psmdb-engine-config --ignore-not-found
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/test-psmdb-cluster -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: psmdb.percona.com/v1
            kind: PerconaServerMongoDB
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: everest-secrets-test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: test-psmdb-cluster-conn
            for:
              deletion: {}

    - name: create-cluster-with-user-secret
      try:
        - apply:
            file: 30-create-cluster-user-secret.yaml
        - assert:
            file: 30-assert.yaml

    - name: delete-cluster-with-user-secret
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/test-psmdb-user-secret psmdb/test-psmdb-user-secret --wait=false && sleep 5
              kubectl -n $NAMESPACE delete secret/everest-secrets-test-psmdb-user-secret secret/test-psmdb-user-credentials --ignore-not-found
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/test-psmdb-user-secret -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-psmdb-user-secret
            for:
              deletion: {}
        - wait:
            apiVersion: psmdb.percona.com/v1
            kind: PerconaServerMongoDB
            name: test-psmdb-user-secret
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: everest-secrets-test-psmdb-user-secret
            for:
              deletion: {}

    - name: create-single-node-cluster
      try:
        - apply:
            file: 40-create-single-node-cluster.yaml
        - assert:
            file: 40-assert.yaml

    - name: single-node-cluster-ready
      try:
        - apply:
            file: 41-cluster-ready.yaml
        - script:
            content: |
              generation=$(kubectl get psmdb/test-psmdb-cluster -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              kubectl patch psmdb/test-psmdb-cluster --subresource status -n $NAMESPACE --type=merge \
                -p '{"status":{"state":"ready","observedGeneration":'"${generation}"',"size":1,"ready":1,"host":"test-psmdb-cluster-host","replsets":{"rs0":{"initialized":true,"size":1,"ready":1,"status":"ready","members":{"test-psmdb-cluster-rs0-0":{"name":"test-psmdb-cluster-rs0-0:27017","state":1,"stateStr":"PRIMARY"}}}}}}'
        - assert:
            file: 41-assert.yaml

    - name: delete-single-node-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/test-psmdb-cluster psmdb/test-psmdb-cluster --wait=false && sleep 5
              kubectl -n $NAMESPACE delete secret/everest-secrets-test-psmdb-cluster
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/test-psmdb-cluster -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: psmdb.percona.com/v1
            kind: PerconaServerMongoDB
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: everest-secrets-test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: test-psmdb-cluster-conn
            for:
              deletion: {}
