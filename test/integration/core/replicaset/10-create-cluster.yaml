apiVersion: kuttl.dev/v1
kind: TestStep
timeout: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psmdb-engine-config
data:
  mongod.conf: |
    operationProfiling:
      mode: all
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  provider: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
      config:
        configMapRef:
          name: psmdb-engine-config
        key: mongod.conf
