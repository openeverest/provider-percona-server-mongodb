apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
  # engine:
  #   replicas: 1
  #   resources:
  #     cpu: "1"
  #     memory: 4G
  #   storage:
  #     size: 25Gi
  #   type: psmdb
  #   userSecretsName: everest-secrets-test-psmdb-cluster
  # proxy:
  #   expose:
  #     type: internal
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  # The provider must not configure PMM when monitoring is disabled.
  (pmm.enabled == null): true
  (pmm.serverHost == null): true
  (pmm.resources.limits == null): true
  (pmm.resources.requests == null): true
  imagePullPolicy: IfNotPresent
  backup:
    configuration:
      backupOptions:
        oplogSpanMin: 0
        timeouts:
          startingStatus: 120
    enabled: false
    pitr: {}
    resources:
      limits:
        cpu: 300m
        memory: 1G
  multiCluster:
    enabled: false
  replsets:
    - arbiter:
        enabled: false
        resources: {}
        size: 0
      expose:
        enabled: true
        type: ClusterIP
      name: rs0
      nonvoting:
        enabled: false
        resources: {}
        size: 0
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      size: 1
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 25Gi
  secrets:
    encryptionKey: test-psmdb-cluster-mongodb-encryption-key
    sslInternal: test-psmdb-cluster-ssl-internal
    users: everest-secrets-test-psmdb-cluster
  sharding:
    balancer: {}
    enabled: false
  unsafeFlags:
    replsetSize: true
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    schedule: 0 4 * * *
    setFCV: true

