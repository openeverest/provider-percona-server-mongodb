apiVersion: kuttl.dev/v1
kind: TestAssert
timeout: 10
collectors:
  - command: kubectl get in/test-psmdb-cluster -n ${NAMESPACE} -o yaml
  - command: kubectl get psmdb/test-psmdb-cluster -n ${NAMESPACE} -o yaml
resourceRefs:
  - apiVersion: core.openeverest.io/v1alpha1
    kind: Instance
    name: test-psmdb-cluster
    ref: in
  - apiVersion: psmdb.percona.com/v1
    kind: PerconaServerMongoDB
    name: test-psmdb-cluster
    ref: psmdb
assertAll:

  # Verify affinity is applied to PSMDB replset
  - celExpr: "has(psmdb.spec.replsets[0].affinity)"
    message: "affinity is not set in PSMDB replset"

  - celExpr: "has(psmdb.spec.replsets[0].affinity.advanced)"
    message: "advanced affinity is not set in PSMDB replset"

  - celExpr: "has(psmdb.spec.replsets[0].affinity.advanced.podAntiAffinity)"
    message: "podAntiAffinity is not set in PSMDB replset"

  # Verify podAntiAffinity has the expected structure
  - celExpr: "size(psmdb.spec.replsets[0].affinity.advanced.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution) > 0"
    message: "podAntiAffinity preferredDuringSchedulingIgnoredDuringExecution is empty"

  - celExpr: "psmdb.spec.replsets[0].affinity.advanced.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight == 100"
    message: "podAntiAffinity weight is not 100"

  - celExpr: "psmdb.spec.replsets[0].affinity.advanced.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey == 'kubernetes.io/hostname'"
    message: "podAntiAffinity topologyKey is not kubernetes.io/hostname"
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  provider: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 2
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
status:
  phase: Ready
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  replsets:
    - name: rs0
      size: 2
      affinity:
        advanced:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
status:
  state: ready
