apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-test-psmdb-user-secret
  labels:
    app.kubernetes.io/managed-by: everest
    app.kubernetes.io/instance: test-psmdb-user-secret
(base64_decode(data.MONGODB_DATABASE_ADMIN_USER)): databaseAdmin
(base64_decode(data.MONGODB_DATABASE_ADMIN_PASSWORD)): database-admin-pass
(base64_decode(data.MONGODB_CLUSTER_ADMIN_USER)): clusterAdmin
(base64_decode(data.MONGODB_USER_ADMIN_USER)): userAdmin
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-user-secret
spec:
  providerRef:
    name: percona-server-mongodb
  userSecretRef:
    name: test-psmdb-user-credentials
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-user-secret
spec:
  secrets:
    users: everest-secrets-test-psmdb-user-secret
