apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-tls-issuer
spec:
  providerRef:
    name: percona-server-mongodb
  parameters:
    tls:
      issuer:
        name: corp-pca
        kind: AWSPCAClusterIssuer
        group: awspca.cert-manager.io
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
