---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-tls
spec:
  description: |
    TLS configuration: an instance requiring TLS with its own certificates,
    switching to preferred TLS, and refusing to turn TLS off once running; an
    external cert-manager issuer, and additionalNames rejected until the
    operator supports them.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,psmdb -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mongodb
        tail: 100
  steps:
    # We don't need the PSMDB operator to be running for the integration
    # tests, but the deployment must exist in the test namespace.
    - name: setup
      try:
        - script:
            content: |
              curl -fsSL "https://raw.githubusercontent.com/percona/percona-server-mongodb-operator/v${PSMDB_OPERATOR_VERSION:-1.21.1}/deploy/operator.yaml" \
                | sed 's/replicas: [0-9]/replicas: 0/g' | kubectl apply -n $NAMESPACE -f -
        - apply:
            file: 00-certificate-secret.yaml

    - name: require-tls-with-own-certificates
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    - name: prefer-tls
      try:
        - apply:
            file: 20-prefer-tls.yaml
        - assert:
            file: 20-assert.yaml

    # TLS can't be turned off once the provider has reconciled the Instance,
    # which is when the runtime records the version it applies.
    - name: tls-stays-on
      try:
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: psmdb-tls
              status:
                (version != null && version != ''): true
        - script:
            content: >-
              kubectl -n $NAMESPACE patch in/psmdb-tls --type merge
              -p '{"spec":{"parameters":{"tls":{"mode":"disabled","certificateSecretName":null}}}}'
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.mode')): true
        - assert:
            file: 30-assert.yaml

    - name: external-issuer
      try:
        - apply:
            file: 40-external-issuer.yaml
        - assert:
            file: 40-assert.yaml

    # Waits for operator support: K8SPSMDB-1228.
    - name: additional-names-rejected
      try:
        - script:
            content: kubectl apply --dry-run=server -n $NAMESPACE -f 41-additional-names.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.additionalNames')): true
              (contains($stderr, 'K8SPSMDB-1228')): true

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/psmdb-tls in/psmdb-tls-issuer psmdb/psmdb-tls psmdb/psmdb-tls-issuer --wait=false && sleep 5
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              for p in psmdb-tls psmdb-tls-issuer; do
                kubectl -n $NAMESPACE patch psmdb/$p -p '{"metadata":{"finalizers":null}}' --type merge
              done
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: psmdb-tls
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: psmdb-tls-issuer
            for:
              deletion: {}
