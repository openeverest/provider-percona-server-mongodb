apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-tls-names
spec:
  providerRef:
    name: percona-server-mongodb
  parameters:
    tls:
      additionalNames:
        - mongo.example.com
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
