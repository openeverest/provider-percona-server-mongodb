apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-nosecret
spec:
  providerRef:
    name: percona-server-mongodb
  userSecretRef:
    name: test-admission-missing-users
  topology:
    type: replicaSet
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
      storage:
        size: 25Gi
