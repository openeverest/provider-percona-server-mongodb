apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  topology:
    type: sharded
    parameters:
      numShards: 2
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
    proxy:
      type: mongod
      replicas: 3
    configServer:
      type: mongod
      replicas: 3
      storage:
        size: 25Gi
# spec:
#   engine:
#     replicas: 3
#     resources:
#       cpu: "1"
#       memory: 4G
#     storage:
#       size: 25Gi
#     type: psmdb
#     userSecretsName: everest-secrets-test-psmdb-cluster
#   proxy:
#     expose:
#       type: internal
status:
  # status: ready
  phase: Ready
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  # The provider must not set PMM server/resources when monitoring is disabled.
  (pmm.enabled == null): true
  (pmm.serverHost == null): true
  (pmm.resources.limits == null): true
  (pmm.resources.requests == null): true
  backup:
    configuration:
      backupOptions:
        oplogSpanMin: 0
        timeouts:
          startingStatus: 120
    enabled: false
    pitr: {}
    resources:
      limits:
        cpu: 300m
        memory: 1G
  enableVolumeExpansion: true
  imagePullPolicy: IfNotPresent
  multiCluster:
    enabled: false
  pmm:
    image: ""
    resources: {}
  replsets:
  - arbiter:
      enabled: false
      resources: {}
      size: 0
    configuration: |2

            operationProfiling:
              mode: slowOp
    expose:
      enabled: false
      type: ClusterIP
    hidden:
      enabled: false
      resources: {}
      size: 0
    name: rs0
    nonvoting:
      enabled: false
      resources: {}
      size: 0
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      limits:
        cpu: "1"
        memory: 4G
      requests:
        cpu: 500m
        memory: 2G
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 25Gi
  - arbiter:
      enabled: false
      resources: {}
      size: 0
    configuration: |2

            operationProfiling:
              mode: slowOp
    expose:
      enabled: false
    hidden:
      enabled: false
      resources: {}
      size: 0
    name: rs1
    nonvoting:
      enabled: false
      resources: {}
      size: 0
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      limits:
        cpu: "1"
        memory: 4G
      requests:
        cpu: 500m
        memory: 2G
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 25Gi
  secrets:
    encryptionKey: test-psmdb-cluster-mongodb-encryption-key
    sslInternal: test-psmdb-cluster-ssl-internal
    users: everest-secrets-test-psmdb-cluster
  sharding:
    balancer: {}
    configsvrReplSet:
      arbiter:
        enabled: false
        resources: {}
        size: 0
      expose:
        enabled: false
      hidden:
        enabled: false
        resources: {}
        size: 0
      nonvoting:
        enabled: false
        resources: {}
        size: 0
      resources: {}
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 25Gi
    enabled: true
    mongos:
      expose:
        type: ClusterIP
      resources: {}
      size: 3
  unsafeFlags: {}
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    schedule: 0 4 * * *
    setFCV: true
status:
  state: ready
---
