apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  topology:
    type: sharded
    parameters:
      numShards: 3
  components:
    proxy:
      service:
        serviceType: NodePort
status:
  phase: Ready
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  # Verify replsets (shards) are NOT exposed
  replsets:
    - expose:
        enabled: false
    - expose:
        enabled: false
    - expose:
        enabled: false
  # Verify mongos (proxy) IS exposed
  sharding:
    enabled: true
    mongos:
      expose:
        type: NodePort
    # Verify config server is NOT exposed
    configsvrReplSet:
      expose:
        enabled: false
status:
  state: ready
