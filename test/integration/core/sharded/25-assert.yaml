apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  topology:
    type: sharded
    parameters:
      numShards: 3
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
    proxy:
      type: mongod
      replicas: 3
      parameters:
        configuration: |
          systemLog:
            verbosity: 1
    configServer:
      type: mongod
      replicas: 3
      storage:
        size: 25Gi
status:
  phase: Ready
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-psmdb-cluster
spec:
  sharding:
    enabled: true
    mongos:
      configuration: |
        systemLog:
          verbosity: 1
      size: 3
status:
  state: ready

