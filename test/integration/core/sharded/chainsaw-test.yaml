---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-sharded
spec:
  description: |
    Lifecycle of a sharded Instance: create, add a shard, affinity and expose
    updates, apply a custom mongos (proxy) configuration, and deletion.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,psmdb -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mongodb
        tail: 100
  steps:
    # We don't need the PSMDB operator to be running for the integration
    # tests, but the deployment must exist in the test namespace.
    - name: install-psmdb-operator
      try:
        - script:
            content: |
              curl -fsSL "https://raw.githubusercontent.com/percona/percona-server-mongodb-operator/v${PSMDB_OPERATOR_VERSION:-1.21.1}/deploy/operator.yaml" \
                | sed 's/replicas: [0-9]/replicas: 0/g' | kubectl apply -n $NAMESPACE -f -
        - assert:
            file: 00-assert.yaml

    - name: create-cluster
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Create the users secret and then simulate the PSMDB operator (scaled to
    # 0) marking the cluster ready the way it does: for the latest generation,
    # with a primary in every shard and in the config servers, the shards
    # joined and mongos ready. The secret is created first because the
    # provider reads it for the connection details as soon as the cluster is
    # ready, and would otherwise fail and retry with a growing delay.
    - name: cluster-ready
      try:
        - apply:
            file: 11-cluster-ready.yaml
        - script:
            content: |
              generation=$(kubectl get psmdb/test-psmdb-cluster -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              kubectl patch psmdb/test-psmdb-cluster --subresource status -n $NAMESPACE --type=merge \
                -p '{"status":{"state":"ready","observedGeneration":'"${generation}"',"size":12,"ready":12,"host":"test-psmdb-cluster-mongos.default.svc.cluster.local:27017","mongos":{"size":3,"ready":3,"status":"ready"},"replsets":{"rs0":{"initialized":true,"added_as_shard":true,"size":3,"ready":3,"status":"ready","members":{"test-psmdb-cluster-rs0-0":{"name":"test-psmdb-cluster-rs0-0:27017","state":1,"stateStr":"PRIMARY"}}},"rs1":{"initialized":true,"added_as_shard":true,"size":3,"ready":3,"status":"ready","members":{"test-psmdb-cluster-rs1-0":{"name":"test-psmdb-cluster-rs1-0:27017","state":1,"stateStr":"PRIMARY"}}},"cfg":{"initialized":true,"size":3,"ready":3,"status":"ready","members":{"test-psmdb-cluster-cfg-0":{"name":"test-psmdb-cluster-cfg-0:27017","state":1,"stateStr":"PRIMARY"}}}}}}'
        - assert:
            file: 11-assert.yaml

    - name: add-shard
      try:
        - apply:
            file: 20-update-cluster.yaml
        - assert:
            file: 20-assert.yaml

    - name: update-affinity
      try:
        - apply:
            file: 21-update-cluster-affinity.yaml
        - assert:
            file: 21-assert.yaml

    - name: expose-load-balancer
      try:
        - apply:
            file: 22-update-cluster-lb.yaml
        - assert:
            file: 22-assert.yaml

    - name: expose-cluster-ip
      try:
        - apply:
            file: 23-update-cluster-cluster-ip.yaml
        - assert:
            file: 23-assert.yaml

    - name: expose-node-port
      try:
        - apply:
            file: 24-update-cluster-node-port.yaml
        - assert:
            file: 24-assert.yaml

    - name: update-custom-proxy-config
      try:
        - apply:
            file: 25-update-cluster-proxy-config.yaml
        - assert:
            file: 25-assert.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/test-psmdb-cluster psmdb/test-psmdb-cluster --wait=false && sleep 5
              kubectl -n $NAMESPACE delete secret/everest-secrets-test-psmdb-cluster
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/test-psmdb-cluster -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: psmdb.percona.com/v1
            kind: PerconaServerMongoDB
            name: test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: everest-secrets-test-psmdb-cluster
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: test-psmdb-cluster-conn
            for:
              deletion: {}
