apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: dGVzdC1hY2Nlc3Mta2V5
  AWS_SECRET_ACCESS_KEY: dGVzdC1zZWNyZXQta2V5
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-storage-s3
spec:
  type: s3
  s3:
    bucket: test-backup-bucket
    region: us-east-1
    endpointURL: http://minio.minio.svc.cluster.local:9000
    forcePathStyle: true
    credentialsSecretRef:
      name: backup-storage-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-mongodb
spec:
  displayName: Percona Backup for MongoDB
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mongodb
  providerManaged:
    supportsPITR: true
    supportsImport: true
    limits:
      maxPITREnabledStorages: 1
  importParametersSchema:
    openAPIV3Schema:
      type: object
      required:
        - path
        - credentialsSecretRef
      properties:
        path:
          type: string
          description: Path to PBM backup in the S3 bucket
        credentialsSecretRef:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Name of the secret containing MongoDB credentials
