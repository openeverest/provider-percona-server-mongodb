apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: rp-restore
spec:
  instanceRef:
    name: rp-psmdb-cluster
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: rp-backup
  parameters:
    selective:
      withUsersAndRoles: true
      namespaces:
        - testdb.testcoll
      nsFrom: olddb.oldcoll
      nsTo: newdb.newcoll
    replsetRemapping:
      rs0: rs1
status:
  state: Pending
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: rp-restore
spec:
  clusterName: rp-psmdb-cluster
  backupName: rp-backup
  selective:
    withUsersAndRoles: true
    namespaces:
      - testdb.testcoll
    nsFrom: olddb.oldcoll
    nsTo: newdb.newcoll
  replsetRemapping:
    rs0: rs1

