apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: dest-psmdb-cluster
status:
  # A new Instance being seeded has not been available yet.
  phase: Pending
  (conditions[?type == 'Restoring'].status | [0]): "True"
  (conditions[?type == 'Ready'].status | [0]): "False"
  (conditions[?type == 'Ready'].reason | [0]): Restoring
  (conditions[?type == 'Available'].status | [0]): "False"
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: dest-psmdb-cluster
status:
  state: ready
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: dest-psmdb-cluster
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  clusterName: dest-psmdb-cluster
  storageName: test-storage-s3
