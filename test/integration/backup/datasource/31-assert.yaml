apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: dest-psmdb-cluster
status:
  phase: Restoring
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: dest-psmdb-cluster
status:
  state: ready
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: dest-psmdb-cluster
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  clusterName: dest-psmdb-cluster
  storageName: test-storage-s3
