apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: dest-psmdb-cluster
status:
  phase: Restoring
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: dest-psmdb-cluster
status:
  state: ready
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: dest-psmdb-cluster
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: dest-psmdb-cluster-datasource
spec:
  clusterName: dest-psmdb-cluster
  # The restore reads where the source Instance wrote the backup.
  (storageName == null): true
  backupSource:
    storageName: test-storage-s3
    destination: s3://test-storage-s3/src-psmdb-cluster/dee8317b-b24e-45f5-bd8d-bf2aff04819d/2025-01-01T01:02:03Z
