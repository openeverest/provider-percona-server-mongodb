apiVersion: kuttl.dev/v1
kind: TestAssert
timeout: 30
collectors:
  - command: kubectl get in/src-psmdb-cluster -n ${NAMESPACE} -o yaml
  - command: kubectl get psmdb/src-psmdb-cluster -n ${NAMESPACE} -o yaml
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-psmdb-cluster
status:
  phase: Ready
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: src-psmdb-cluster
spec:
  imagePullPolicy: IfNotPresent
  backup:
    enabled: true
    storages:
      test-storage-s3:
        type: s3
        s3:
          bucket: test-backup-bucket
          credentialsSecret: backup-storage-credentials
          endpointUrl: http://fake
          insecureSkipTLSVerify: true
          region: us-east-1
  secrets:
    encryptionKey: src-psmdb-cluster-mongodb-encryption-key
    sslInternal: src-psmdb-cluster-ssl-internal
    users: everest-secrets-src-psmdb-cluster
status:
  state: ready
---
