apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
    - storageRef:
        name: test-storage-s3
      schedules:
        - name: nightly
          enabled: true
          cron: "0 2 * * *"
          retention:
            type: count
            count: 5
          parameters:
            type: external
            compressionType: zstd
            compressionLevel: 9
            volumeSnapshotClass: csi-snapclass
      pitr:
        enabled: true
        parameters:
          oplogSpanMin: "15"
          compressionType: lz4
          compressionLevel: 3
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
    backupAgent:
      type: backup
      resources:
        limits:
          cpu: 500m
          memory: 750M
