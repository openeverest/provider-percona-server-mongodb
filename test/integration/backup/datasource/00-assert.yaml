apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-percona-server-mongodb-operator
  namespace: provider-system
spec:
  replicas: 0
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
type: Opaque
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-storage-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: test-backup-bucket
  parameters:
    region: us-east-1
    endpointURL: http://fake
    forcePathStyle: true
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: backup-storage-credentials
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-mongodb
spec:
  displayName: Percona Backup for MongoDB
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mongodb
