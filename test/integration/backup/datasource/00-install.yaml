apiVersion: kuttl.dev/v1
kind: TestStep
timeout: 10
commands:
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: dGVzdC1hY2Nlc3Mta2V5
  AWS_SECRET_ACCESS_KEY: dGVzdC1zZWNyZXQta2V5
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-storage-s3
spec:
  type: s3
  s3:
    bucket: test-backup-bucket
    region: us-east-1
    endpointURL: http://fake
    forcePathStyle: true
    credentialsSecretName: backup-storage-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-mongodb
spec:
  displayName: Percona Backup for MongoDB
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mongodb
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
