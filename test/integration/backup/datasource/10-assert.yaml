apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
    - storageRef:
        name: test-storage-s3
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: src-psmdb-cluster
spec:
  backup:
    enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 750M
    storages:
      test-storage-s3:
        type: s3
        s3:
          bucket: test-backup-bucket
          (starts_with(prefix, join('/', ['backups', $namespace, 'src-psmdb-cluster', '']))): true
          (ends_with(prefix, '/test-storage-s3')): true
          credentialsSecret: backup-storage-credentials
          endpointUrl: http://fake
          forcePathStyle: true
          region: us-east-1
    tasks:
      - name: nightly
        enabled: true
        schedule: "0 2 * * *"
        storageName: test-storage-s3
        type: external
        compressionType: zstd
        compressionLevel: 9
        volumeSnapshotClass: csi-snapclass
        retention:
          type: count
          count: 5
          deleteFromStorage: true
    pitr:
      enabled: true
      oplogSpanMin: "15"
      compressionType: lz4
      compressionLevel: 3
