apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: dest-psmdb-cluster
spec:
  providerRef:
    name: percona-server-mongodb
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
    - storageRef:
        name: test-storage-s3
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
status:
  # A new Instance being seeded has not been available yet.
  phase: Pending
  (conditions[?type == 'Restoring'].status | [0]): "True"
  (conditions[?type == 'Ready'].status | [0]): "False"
  (conditions[?type == 'Ready'].reason | [0]): Restoring
  (conditions[?type == 'Available'].status | [0]): "False"
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: dest-psmdb-cluster
spec:
  backup:
    enabled: true
    storages:
      test-storage-s3:
        type: s3
        s3:
          bucket: test-backup-bucket
          credentialsSecret: backup-storage-credentials
          endpointUrl: http://fake
          insecureSkipTLSVerify: true
          region: us-east-1
