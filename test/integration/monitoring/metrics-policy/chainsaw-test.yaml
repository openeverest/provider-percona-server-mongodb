---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-metrics-policy
spec:
  description: |
    spec.monitoring.sources.metrics.policy: Always turns the mongodb_exporter
    sidecars on without any monitoring destination, and once the cluster is
    Ready the provider publishes the exporter's endpoint for a scraper
    OpenEverest does not configure. Back on OnDemand nothing needs metrics,
    so the sidecars and the endpoint go.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,psmdb -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mongodb
        tail: 100
  steps:
    # We don't need the PSMDB operator to be running for the integration
    # tests, but the deployment must exist in the test namespace.
    - name: setup
      try:
        - script:
            content: |
              curl -fsSL "https://raw.githubusercontent.com/percona/percona-server-mongodb-operator/v${PSMDB_OPERATOR_VERSION:-1.21.1}/deploy/operator.yaml" \
                | sed 's/replicas: [0-9]/replicas: 0/g' | kubectl apply -n $NAMESPACE -f -

    - name: create-cluster-with-metrics-always
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Simulate the PSMDB operator marking the cluster ready: the provider
    # publishes metrics endpoints only for a serving cluster.
    - name: cluster-ready
      try:
        - script:
            content: |
              kubectl patch psmdb/psmdb-metrics-policy --subresource status -n $NAMESPACE \
                -p '{"status":{"state":"ready", "size":3, "ready":3, "host":"psmdb-metrics-policy-rs0.default.svc.cluster.local", "replsets":{"rs0":{"size":3, "ready":3, "status":"ready"}}}}' --type=merge
        - assert:
            file: 11-assert.yaml

    - name: back-to-on-demand
      try:
        - apply:
            file: 20-on-demand.yaml
        - assert:
            file: 20-assert.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/psmdb-metrics-policy psmdb/psmdb-metrics-policy --wait=false && sleep 5
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/psmdb-metrics-policy -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: psmdb-metrics-policy
            for:
              deletion: {}
