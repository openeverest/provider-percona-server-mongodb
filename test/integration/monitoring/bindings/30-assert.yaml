# With no destinations left the legacy path renders PMM off and the Instance
# reports no monitoring at all.
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-bindings
spec:
  (pmm.enabled == null): true
  (pmm.serverHost == null): true
  replsets:
    - name: rs0
      (sidecars == null): true
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-bindings
spec:
  (monitoring == null): true
status:
  (monitoring == null || monitoring.destinations == null): true
