apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-bindings
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
  monitoring:
    destinations:
      - name: pmm
        destinationRef:
          name: pmm-it
        parameters:
          resources:
            limits:
              memory: 400Mi
      - name: prometheus
        destinationRef:
          name: prometheus-it
