apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-metrics
spec:
  # Metrics alone do not turn PMM on.
  (pmm.enabled == null): true
  (pmm.serverHost == null): true
  replsets:
    - name: rs0
      sidecars:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.53.0
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: everest-secrets-psmdb-metrics
                  key: MONGODB_CLUSTER_MONITOR_USER
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: everest-secrets-psmdb-metrics
                  key: MONGODB_CLUSTER_MONITOR_PASSWORD
          ports:
            - name: metrics
              containerPort: 9216
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: psmdb-metrics-prometheus
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: psmdb-metrics
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: psmdb-metrics
  podTargetLabels:
    - core.openeverest.io/instance
    - core.openeverest.io/component
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
