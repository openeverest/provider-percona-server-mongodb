---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-metrics
spec:
  description: |
    Metrics exposure lifecycle: expose metrics with Prometheus scraping, switch
    scraping to VictoriaMetrics, stop exposing metrics, and clean up. Metrics
    run without PMM, so the monitoring component carries no MonitoringConfig.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,psmdb,podmonitor,vmpodscrape -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-server-mongodb
        tail: 100
  steps:
    # We don't need the PSMDB operator to be running for the integration
    # tests, but the deployment must exist in the test namespace.
    - name: setup
      try:
        - script:
            content: |
              curl -fsSL "https://raw.githubusercontent.com/percona/percona-server-mongodb-operator/v${PSMDB_OPERATOR_VERSION:-1.21.1}/deploy/operator.yaml" \
                | sed 's/replicas: [0-9]/replicas: 0/g' | kubectl apply -n $NAMESPACE -f -
        # Only the CRDs are needed: the provider creates the scrape resources,
        # no operator has to act on them.
        - script:
            timeout: 120s
            content: |
              kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.2/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
              kubectl apply --server-side -f https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.75.1/config/crd/overlay/crd.descriptionless.yaml
              kubectl wait --for=condition=Established --timeout=60s crd/podmonitors.monitoring.coreos.com crd/vmpodscrapes.operator.victoriametrics.com
        - assert:
            file: 00-assert.yaml

    - name: expose-metrics-to-prometheus
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml
        - error:
            file: 10-errors.yaml

    - name: switch-to-victoriametrics
      try:
        - apply:
            file: 20-switch-to-victoriametrics.yaml
        - assert:
            file: 20-assert.yaml
        - error:
            file: 20-errors.yaml

    - name: stop-exposing-metrics
      try:
        - apply:
            file: 30-disable-metrics.yaml
        - assert:
            file: 30-assert.yaml
        - error:
            file: 30-errors.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete in/psmdb-metrics psmdb/psmdb-metrics --wait=false && sleep 5
              # The PSMDB operator is scaled to 0, so nothing processes the psmdb finalizers.
              kubectl -n $NAMESPACE patch psmdb/psmdb-metrics -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: psmdb-metrics
            for:
              deletion: {}
