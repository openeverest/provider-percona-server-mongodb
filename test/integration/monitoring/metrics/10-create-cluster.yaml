apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-metrics
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
    monitoring:
      type: pmm
      parameters:
        metrics:
          prometheus:
            enabled: true
          victoriaMetrics:
            enabled: false
