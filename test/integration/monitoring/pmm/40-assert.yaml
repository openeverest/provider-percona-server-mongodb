apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  # Monitoring must be fully removed from the Instance spec.
  (components.monitoring == null): true
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: mc-psmdb
spec:
  type: pmm
  pmm:
    credentialsSecretRef:
      name: mc-psmdb-secret
    verifyTLS: false
    url: http://localhost-mc-psmdb-updated
# status:
#   inUse: false
---
apiVersion: v1
kind: Secret
metadata:
  name: mc-psmdb-secret
  # ownerReferences:
  #   - apiVersion: everest.percona.com/v1alpha1
  #     blockOwnerDeletion: true
  #     controller: true
  #     kind: MonitoringConfig
  #     name: mc-psmdb
type: Opaque
data:
  apiKey: YXNkZmcxMjM=
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-mc
spec:
  # PMM must be fully removed when monitoring is disabled.
  (pmm.enabled == null): true
  (pmm.serverHost == null): true
  (pmm.resources.limits == null): true
  (pmm.resources.requests == null): true
  secrets:
    users: everest-secrets-psmdb-mc
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-mc
type: Opaque
data:
  PMM_SERVER_TOKEN: YXNkZmcxMjM=
