apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
    proxy:
      type: mongod
      replicas: 1
    monitoring:
      type: pmm
      parameters:
        monitoringConfigName: mc-psmdb
