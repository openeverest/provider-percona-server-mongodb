apiVersion: kuttl.dev/v1
kind: TestStep
timeout: 10
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  provider: percona-server-mongodb
  components:
    engine:
      type: mongod
      replicas: 3
      storage:
        size: 4Gi
      resources:
        limits:
          cpu: 300m
          memory: 500M
    proxy:
      type: mongod
      replicas: 1
    monitoring:
      type: pmm
      customSpec:
        monitoringConfigName: mc-psmdb
