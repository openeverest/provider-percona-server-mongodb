apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  components:
    monitoring:
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      parameters:
        monitoringConfigName: mc-psmdb
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: mc-psmdb
spec:
  type: pmm
  pmm:
    credentialsSecretRef:
      name: mc-psmdb-secret
    verifyTLS: false
    url: http://localhost-mc-psmdb-updated
# status:
#   inUse: true
---
apiVersion: v1
kind: Secret
metadata:
  name: mc-psmdb-secret
  # ownerReferences:
  #   - apiVersion: everest.percona.com/v1alpha1
  #     blockOwnerDeletion: true
  #     controller: true
  #     kind: MonitoringConfig
  #     name: mc-psmdb
type: Opaque
data:
  apiKey: YXNkZmcxMjM=
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-mc
spec:
  pmm:
    enabled: true
    serverHost: localhost-mc-psmdb-updated
    # image: percona/pmm-client:updated
    image: percona/pmm-client:2.44.1
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  secrets:
    users: everest-secrets-psmdb-mc
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-mc
type: Opaque
data:
  PMM_SERVER_TOKEN: YXNkZmcxMjM=
