apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  components:
    monitoring:
      type: pmm
      version: 2.44.1
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-mc
spec:
  pmm:
    enabled: true
    serverHost: localhost-mc-psmdb
    image: percona/pmm-client:2.44.1
  secrets:
    users: everest-secrets-psmdb-mc
