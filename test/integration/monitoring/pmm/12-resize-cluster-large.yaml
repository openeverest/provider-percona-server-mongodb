apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      resources:
        limits:
          memory: 32G
    monitoring:
      resources:
        requests:
          memory: 330M
        limits:
          cpu: 330m
