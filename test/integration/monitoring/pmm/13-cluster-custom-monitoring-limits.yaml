apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-mc
spec:
  components:
    engine:
      resources:
        limits:
          memory: 32G
    monitoring:
      resources:
        limits:
          memory: 1G
          cpu: 1
      parameters:
        monitoringConfigName: mc-psmdb
