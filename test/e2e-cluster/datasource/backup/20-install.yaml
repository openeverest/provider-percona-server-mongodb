apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=     # seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4= # seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: everest-operator
  parameters:
    region: us-east-1
    endpointURL: https://seaweedfs.seaweedfs.svc
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: seaweedfs-credentials
  tls:
    insecureSkipVerify: true
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-mongodb
spec:
  displayName: Percona Backup for MongoDB
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mongodb
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
---
# A minimal pmm class, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: pmm-e2e
spec:
  providerManaged:
    integration: pmm
    agentImage: percona/pmm-client:3.9.1
    agentVersion: 3.9.1
  authModes:
    - name: ServiceAccountToken
      credentials:
        required: [token]
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm
spec:
  classRef:
    name: pmm-e2e
  parameters:
    url: https://pmm-server.pmm.svc
  tls:
    insecureSkipVerify: true
  # The credentials Secret is created dynamically in the deploy-pmm step,
  # since the PMM service-account token is generated at runtime.
  authentication:
    mode: ServiceAccountToken
    credentialsSecretRef:
      name: pmm-token
