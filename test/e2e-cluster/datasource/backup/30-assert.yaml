apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-src
spec:
  providerRef:
    name: percona-server-mongodb
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
      - storageRef:
          name: seaweedfs-storage
  topology:
    type: replicaset
  components:
    engine:
      type: mongod
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 600m
          memory: 512Mi
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-src
spec:
  backup:
    enabled: true
    storages:
      seaweedfs-storage:
        type: minio
        minio:
          bucket: everest-operator
          (starts_with(prefix, join('/', ['backups', $namespace, 'psmdb-src', '']))): true
          (ends_with(prefix, '/seaweedfs-storage')): true
          credentialsSecret: seaweedfs-credentials
          endpointUrl: seaweedfs.seaweedfs.svc:443
          secure: true
          insecureSkipTLSVerify: true
          region: us-east-1
  pmm:
    enabled: true
    serverHost: pmm-server.pmm.svc
    image: percona/pmm-client:3.9.1
    resources:
      requests:
        memory: 99604Ki
        cpu: 95m
