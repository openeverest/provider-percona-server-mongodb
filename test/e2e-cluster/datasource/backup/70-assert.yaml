apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-dest
spec:
  providerRef:
    name: percona-server-mongodb
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: psmdb-src-backup
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
      - storageRef:
          name: seaweedfs-storage
  topology:
    type: replicaset
  components:
    engine:
      type: mongod
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 600m
          memory: 512Mi
  monitoring:
    destinations:
      - name: pmm
        destinationRef:
          name: pmm
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-dest
spec:
  backup:
    enabled: true
    storages:
      seaweedfs-storage:
        type: minio
        minio:
          bucket: everest-operator
          (starts_with(prefix, join('/', ['backups', $namespace, 'psmdb-dest', '']))): true
          (ends_with(prefix, '/seaweedfs-storage')): true
          credentialsSecret: seaweedfs-credentials
          endpointUrl: seaweedfs.seaweedfs.svc:443
          secure: true
          insecureSkipTLSVerify: true
          region: us-east-1
status:
  state: initializing
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-dest
