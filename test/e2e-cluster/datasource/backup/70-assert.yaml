apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-dest
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: psmdb-src-backup
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-dest
spec:
  backup:
    enabled: true
    storages:
      minio-storage:
        type: s3
        s3:
          bucket: everest-operator
          credentialsSecret: minio-credentials
          endpointUrl: https://minio.minio.svc
          insecureSkipTLSVerify: true
          region: us-east-1
status:
  state: initializing
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-dest
