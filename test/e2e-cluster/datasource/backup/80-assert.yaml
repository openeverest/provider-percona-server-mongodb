apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-dest
status:
  # A new Instance being seeded has not been available yet.
  phase: Pending
  (conditions[?type == 'Restoring'].status | [0]): "True"
  (conditions[?type == 'Ready'].status | [0]): "False"
  (conditions[?type == 'Available'].status | [0]): "False"
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: psmdb-dest-datasource
spec:
  instanceRef:
    name: psmdb-dest
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: psmdb-src-backup
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: psmdb-dest-datasource
spec:
  clusterName: psmdb-dest
  backupSource:
    storageName: seaweedfs-storage
