apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-dest
status:
  phase: Restoring
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: psmdb-dest-datasource
spec:
  instanceRef:
    name: psmdb-dest
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: psmdb-src-backup
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: psmdb-dest-datasource
spec:
  clusterName: psmdb-dest
  # The restore reads where the source Instance wrote the backup.
  (storageName == null): true
  backupSource:
    storageName: seaweedfs-storage
    minio:
      (starts_with(prefix, join('/', ['backups', $namespace, 'psmdb-src', '']))): true
