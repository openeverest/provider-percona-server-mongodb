apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-import-test
spec:
  providerRef:
    name: percona-server-mongodb
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
      - storageRef:
          name: minio-storage
  dataSource:
    type: Import
    import:
      storageRef:
        name: minio-storage
      parameters:
        # Path to the PBM backup in Minio (from testdata/backups/psmdb.tar)
        path: "/psmdb/2025-11-03T09:34:50Z"
        credentialsSecretRef:
          name: psmdb-import-credentials
  topology:
    type: replicaset
  components:
    engine:
      type: mongod
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 600m
          memory: 512Mi
