apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-hidden
spec:
  providerRef:
    name: percona-server-mongodb
  topology:
    type: replicaSet
  components:
    engine:
      type: mongod
      replicas: 3
      resources:
        limits:
          cpu: 600m
          memory: 1Gi
      storage:
        size: 2Gi
    hidden:
      type: mongod
      replicas: 2
      storage:
        size: 3Gi
