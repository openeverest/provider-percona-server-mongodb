apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: bWluaW9hZG1pbg==     # minioadmin
  AWS_SECRET_ACCESS_KEY: bWluaW9hZG1pbg== # minioadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: minio-storage
spec:
  type: s3
  s3:
    bucket: everest-operator
    region: us-east-1
    endpointURL: https://minio.minio.svc
    forcePathStyle: true
    credentialsSecretRef:
      name: minio-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-mongodb
spec:
  displayName: Percona Backup for MongoDB
  executionMode: ProviderManaged
  supportedProviders:
    - percona-server-mongodb
  providerManaged:
    supportsPITR: true
    supportsImport: true
    limits:
      maxPITREnabledStorages: 1
  importParametersSchema:
    openAPIV3Schema:
      type: object
      required:
        - path
        - credentialsSecretRef
      properties:
        path:
          type: string
          description: Path to PBM backup in the S3 bucket
        credentialsSecretRef:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Name of the secret containing MongoDB credentials
