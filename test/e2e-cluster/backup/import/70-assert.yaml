apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-wrong-creds
status:
  # The seeding failed before the database was ever available.
  phase: Pending
  (conditions[?type == 'DataSourceReady']):
    - status: "False"
      reason: UserSecretMismatch
  (conditions[?type == 'Ready']):
    - status: "False"
  (conditions[?type == 'NeedsAttention']):
    - status: "True"
