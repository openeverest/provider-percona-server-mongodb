apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-import-test
spec:
  backup:
    enabled: true
    storages:
      seaweedfs-storage:
        type: minio
        minio:
          bucket: everest-operator
          (starts_with(prefix, join('/', ['backups', $namespace, 'psmdb-import-test', '']))): true
          (ends_with(prefix, '/seaweedfs-storage')): true
          credentialsSecret: seaweedfs-credentials
          endpointUrl: seaweedfs.seaweedfs.svc:443
          secure: true
          insecureSkipTLSVerify: true
          forcePathStyle: true
          region: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-import-test
