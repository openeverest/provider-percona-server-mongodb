apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb-import-test
spec:
  backup:
    enabled: true
    storages:
      seaweedfs-storage:
        type: s3
        s3:
          bucket: everest-operator
          credentialsSecret: seaweedfs-credentials
          endpointUrl: https://seaweedfs.seaweedfs.svc
          insecureSkipTLSVerify: true
          forcePathStyle: true
          region: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: everest-secrets-psmdb-import-test
