apiVersion: v1
kind: Secret
metadata:
  name: psmdb-import-wrong-credentials
  labels:
    openeverest.io/provider: percona-server-mongodb
    openeverest.io/definition: user
    openeverest.io/managed: "true"
type: Opaque
data:
  # Same users as the source cluster but with passwords that do not match the
  # credential hashes stored in the imported backup, so the operator cannot
  # authenticate once the restored system users are in place.
  MONGODB_BACKUP_PASSWORD: d3JvbmctYmFja3VwLXBhc3M=
  MONGODB_BACKUP_USER: YmFja3Vw
  MONGODB_CLUSTER_ADMIN_PASSWORD: d3JvbmctY2x1c3Rlci1hZG1pbi1wYXNz
  MONGODB_CLUSTER_ADMIN_USER: Y2x1c3RlckFkbWlu
  MONGODB_CLUSTER_MONITOR_PASSWORD: d3JvbmctY2x1c3Rlci1tb25pdG9yLXBhc3M=
  MONGODB_CLUSTER_MONITOR_USER: Y2x1c3Rlck1vbml0b3I=
  MONGODB_DATABASE_ADMIN_PASSWORD: d3JvbmctZGF0YWJhc2UtYWRtaW4tcGFzcw==
  MONGODB_DATABASE_ADMIN_USER: ZGF0YWJhc2VBZG1pbg==
  MONGODB_USER_ADMIN_PASSWORD: d3JvbmctdXNlci1hZG1pbi1wYXNz
  MONGODB_USER_ADMIN_USER: dXNlckFkbWlu
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: psmdb-wrong-creds
spec:
  providerRef:
    name: percona-server-mongodb
  userSecretRef:
    name: psmdb-import-wrong-credentials
  backup:
    enabled: true
    classRef:
      name: percona-backup-mongodb
    storages:
      - storageRef:
          name: seaweedfs-storage
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: import-f0c20f37c8b68e24
  topology:
    type: replicaset
  components:
    engine:
      type: mongod
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 600m
          memory: 512Mi
