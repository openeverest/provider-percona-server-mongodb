# Provider configuration for percona-server-mongodb
# This file defines versions, component mappings, topology structure, and UI schema.
# Run `go generate ./...` to produce provider.yaml from this config + Go types.

name: percona-server-mongodb

componentTypes:
  mongod:
    versions:
      - version: "6.0.19-16"
        image: percona/percona-server-mongodb:6.0.19-16-multi
      - version: "6.0.21-18"
        image: percona/percona-server-mongodb:6.0.21-18
      - version: "7.0.18-11"
        image: percona/percona-server-mongodb:7.0.18-11
      - version: "8.0.4-1"
        image: percona/percona-server-mongodb:8.0.4-1-multi
      - version: "8.0.8-3"
        image: percona/percona-server-mongodb:8.0.8-3
      - version: "8.0.12-4"
        image: percona/percona-server-mongodb:8.0.12-4
        default: true
  backup:
    versions:
      - version: "2.11.0"
        image: percona/percona-backup-mongodb:2.11.0
        default: true
      - version: "2.9.1"
        image: percona/percona-backup-mongodb:2.9.1
  pmm:
    versions:
      - version: "2.44.1"
        image: percona/pmm-server:2.44.1
        default: true

# Components map component names to their type and optional OpenAPI schema.
# Omit 'schema' for components that have no custom configuration fields.
components:
  engine:
    type: mongod
  configServer:
    type: mongod
  proxy:
    type: mongod
  backupAgent:
    type: backup
  monitoring:
    type: pmm

# Topologies define deployment modes and their component requirements.
# Omit 'schema' for topologies that have no topology-specific configuration.
topologies:
  replicaSet:
    components:
      engine:
        defaults:
          replicas: 3
      backupAgent:
        optional: true
      monitoring:
        optional: true
  sharded:
    configSchema: ShardedTopologyConfig
    components:
      engine:
        defaults:
          replicas: 3
      proxy: {}
      configServer: {}
      backupAgent:
        optional: true
      monitoring:
        optional: true

# UI schema defines rendering hints for each topology.
# Paths should reference fields in the Instance CR spec (e.g. spec.components.engine.version).
# NOTE: paths are placeholders and will be corrected to match Instance CR fields.
uiSchema:
  replicaSet:
    sections:
      databaseVersion:
        label: "Database Version"
        description: "Provide the information about the database version you want to use."
        components:
          version:
            uiType: select
            path: "spec.engine.version"
            fieldParams:
              label: "Database Version"
              optionsPath: "spec.componentTypes.mongod.versions"
              optionsPathConfig:
                labelPath: "version"
                valuePath: "version"
            validation:
              required: true
      resources:
        label: "Resources"
        description: "Configure the resources your new database will have access to."
        components:
          nodes:
            uiType: group
            components:
              numberOfnodes:
                path: "spec.components.engine.replicas"
                uiType: number
                fieldParams:
                  label: "Number of nodes"
                  defaultValue: 3
                validation:
                  required: true
                  min: 1
                  int: true
                  celExpressions:
                    - celExpr: "spec.components.engine.replicas % 2 == 1"
                      message: "The number of nodes must be odd"

              resources:
                uiType: group
                groupType: line
                components:
                  cpu:
                    path: "spec.components.engine.resources.limits.cpu"
                    uiType: number
                    fieldParams:
                      label: "CPU"
                      defaultValue: 1
                      step: 0.1
                    validation:
                      min: 0.6
                      required: true

                  memory:
                    path: "spec.components.engine.resources.limits.memory"
                    uiType: number
                    fieldParams:
                      label: "Memory"
                      defaultValue: 4
                      step: 0.001
                      badge: "Gi"
                      badgeToApi: true
                    validation:
                      min: 0.512
                      required: true

                  disk:
                    path: "spec.components.engine.storage.size"
                    uiType: number
                    fieldParams:
                      label: "Disk"
                      defaultValue: 25
                      badge: "Gi"
                      badgeToApi: true
                    validation:
                      min: 1
                      int: true
                      required: true
      advanced:
        label: "Advanced configuration"
        description: "Configure advanced settings for your database"
        components:
          storageClass:
            uiType: select
            path: spec.components.engine.storage.storageClass
            fieldParams:
              label: "Storage class"
              defaultValue: "local-path"
              options:
                - label: "local-path"
                  value: "local-path"
    sectionsOrder:
      - databaseVersion
      - resources
      - advanced
  sharded:
    sections:
      databaseVersion:
        label: "Database Version"
        description: "Provide the information about the database version you want to use."
        components:
          version:
            uiType: select
            path: "spec.engine.version"
            fieldParams:
              label: "Database Version"
              optionsPath: "spec.componentTypes.mongod.versions"
              optionsPathConfig:
                labelPath: "version"
                valuePath: "version"
            validation:
              required: true
      resources:
        label: "Resources"
        description: "Some description about resources"
        components:
          shards:
            uiType: number
            path: "spec.sharding.shards"
            fieldParams:
              label: "Nº of shards"
              defaultValue: 1
          numberOfnodes:
            path: "spec.components.engine.replicas"
            uiType: number
            fieldParams:
              label: "Number of nodes"
              defaultValue: 3
            validation:
              required: true
              min: 1
              int: true
              celExpressions:
                - celExpr: "spec.components.engine.replicas % 2 == 1"
                  message: "The number of nodes must be odd"
          nodesResources:
            uiType: group
            groupType: line
            components:
              cpu:
                path: "spec.components.engine.resources.limits.cpu"
                uiType: number
                fieldParams:
                  label: "CPU"
                  defaultValue: 1
                  step: 0.1
                validation:
                  min: 0.6
                  required: true
              memory:
                path: "spec.components.engine.resources.limits.memory"
                uiType: number
                fieldParams:
                  label: "Memory"
                  defaultValue: 4
                  step: 0.001
                  badge: "Gi"
                  badgeToApi: true
                validation:
                  min: 0.512
                  required: true
              disk:
                path: "spec.components.engine.storage.size"
                uiType: number
                fieldParams:
                  label: "Disk"
                  defaultValue: 25
                  badge: "Gi"
                  badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
          numberOfRouters:
            path: "spec.components.proxy.replicas"
            uiType: number
            fieldParams:
              label: "Number of routers"
          routersResources:
            uiType: group
            groupType: line
            components:
              cpu:
                path: "spec.components.proxy.resources.limits.cpu"
                uiType: number
                fieldParams:
                  label: "CPU"
                validation:
                  min: 1
                  max: 10
              memory:
                path: "spec.components.proxy.resources.limits.memory"
                uiType: number
                fieldParams:
                  label: "Memory"
                validation:
                  min: 1
                  max: 10
          numberOfConfigServers:
            uiType: number
            path: "spec.components.configServer.replicas"
            fieldParams:
              label: "Nº of configuration servers"
              defaultValue: 3
            validation:
              celExpressions:
                - celExpr: "!(spec.components.engine.replicas > 1 && spec.components.configServer.replicas == 1)"
                  message: "The number of configuration servers cannot be 1 if the number of database nodes is greater than 1"
        componentsOrder:
          - shards
          - numberOfnodes
          - nodesResources
          - numberOfRouters
          - routersResources
          - numberOfConfigServers
      advanced:
        label: "Advanced configuration"
        description: "Configure advanced settings for your database"
        components:
          storageClass:
            uiType: select
            path: spec.components.engine.storage.storageClass
            fieldParams:
              label: "Storage class"
              defaultValue: "local-path"
              options:
                - label: "local-path"
                  value: "local-path"
          configuration:
            uiType: text
            path: spec.components.engine.configuration
            fieldParams:
              label: "Advanced configuration"
              multiline: true
              minRows: 3
              maxRows: 8
        componentsOrder:
          - storageClass
          - configuration
    sectionsOrder:
      - databaseVersion
      - resources
      - advanced
