# PerconaServerMongodbOperator BackupClass definition.
# This file is the source of truth for the generated BackupClass manifest.
#
# provider-sdk generate makes the class ProviderManaged and names this
# provider in providerManaged.providerRef: the provider claims and executes it.
#
# Fields:
#   displayName/description: human-readable metadata.
#   supportsImport: advertise backup import capability to BackupImport validation.
#   backupStorageClasses: BackupStorageClasses the engine writes to, with their
#     auth modes, the parameters it supports (parametersSchema narrows the
#     storage class's schema) and the spec.tls settings it honours (tls).
#   providerManaged.supportsPITR: advertise PITR capability to Restore validation.
#   providerManaged.limits: caps the runtime enforces against Instance.spec.backup.
#     maxStorages, maxPITREnabledStorages, maxSchedulesPerStorage — unset means unlimited.
#   parametersSchema.openAPIV3Schema / restoreParametersSchema.openAPIV3Schema:
#     Go type names describing backup-time and restore-time parameters respectively.
#
# Co-located files:
#   ui.yaml  — free-form UI rendering hints, inlined verbatim under spec.uiSchema.
#   types.go — Go types referenced above; OpenAPI-extracted by provider-sdk generate.

displayName: "Percona Backup for MongoDB"
description: |
  BackupClass for the Percona Server MongoDB provider. Backups are managed
  natively by Percona Backup for MongoDB (PBM) embedded in the PSMDB operator;
  OpenEverest does not run any side-car Job for this class.
supportsImport: true
backupStorageClasses:
  - name: s3
    authModes:
      - AccessKey
    parametersSchema:
      openAPIV3Schema:
        properties:
          # PBM cannot use GCS through its S3 client.
          implementation:
            enum: [aws, minio, ceph, other]
    tls:
      # minio.caBundle on PBM's minio storage type.
      customCA: Supported
      insecureSkipVerify: Supported

providerManaged:
  supportsPITR: true
  limits:
    # PSMDB supports only a single PITR stream per cluster. The provider also
    # enforces this engine-specific rule defensively, but declaring it here
    # makes the constraint visible to the UI and to other callers.
    maxPITREnabledStorages: 1
    maxStorages: 1

parametersSchema:
  openAPIV3Schema: PerconaBackupParameters

restoreParametersSchema:
  openAPIV3Schema: PerconaRestoreParameters
