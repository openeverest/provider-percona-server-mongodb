# Sharded cluster topology definition.
# This file defines both the structural topology and its UI rendering.

# Topology configuration: which components are used and their defaults.
# configSchema references a Go type in definition/types/ for custom config fields.
config:
  configSchema: ShardedTopologyConfig
  components:
    engine:
      defaults:
        replicas: 3
    proxy: {}
    configServer: {}
    backupAgent:
      optional: true
    monitoring:
      optional: true

# UI schema: rendering hints for the frontend form.
# Paths reference fields in the Instance CR spec.
ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Provide the information about the database version you want to use."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
          validation:
            required: true
    resources:
      label: "Resources"
      description: "Some description about resources"
      components:
        shards:
          uiType: number
          path: "spec.sharding.shards"
          fieldParams:
            required: true
            label: "Nº of shards"
            defaultValue: 1
        numberOfnodes:
          path: "spec.components.engine.replicas"
          uiType: number
          fieldParams:
            label: "Number of nodes"
            defaultValue: 3
          validation:
            required: true
            min: 1
            int: true
            celExpressions:
              - celExpr: "spec.components.engine.replicas % 2 == 1"
                message: "The number of nodes must be odd"
        nodesResources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: "spec.components.engine.resources.limits.cpu"
              uiType: number
              fieldParams:
                label: "CPU"
                defaultValue: 1
                step: 0.1
              validation:
                min: 0.6
                required: true
            memory:
              path: "spec.components.engine.resources.limits.memory"
              uiType: number
              fieldParams:
                label: "Memory"
                defaultValue: 4
                step: 0.001
                badge: "Gi"
                badgeToApi: true
              validation:
                min: 0.512
                required: true
            disk:
              path: "spec.components.engine.storage.size"
              uiType: number
              fieldParams:
                label: "Disk"
                defaultValue: 25
                badge: "Gi"
                badgeToApi: true
              validation:
                min: 1
                int: true
                required: true
        numberOfRouters:
          path: "spec.components.proxy.replicas"
          uiType: number
          fieldParams:
            label: "Number of routers"
        routersResources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: "spec.components.proxy.resources.limits.cpu"
              uiType: number
              fieldParams:
                label: "CPU"
              validation:
                min: 1
                max: 10
            memory:
              path: "spec.components.proxy.resources.limits.memory"
              uiType: number
              fieldParams:
                label: "Memory"
              validation:
                min: 1
                max: 10
        numberOfConfigServers:
          uiType: number
          path: "spec.components.configServer.replicas"
          fieldParams:
            label: "Nº of configuration servers"
            defaultValue: 3
          validation:
            celExpressions:
              - celExpr: "!(spec.components.engine.replicas > 1 && spec.components.configServer.replicas == 1)"
                message: "The number of configuration servers cannot be 1 if the number of database nodes is greater than 1"
      componentsOrder:
        - shards
        - numberOfnodes
        - nodesResources
        - numberOfRouters
        - routersResources
        - numberOfConfigServers
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced settings for your database"
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            defaultValue: "local-path"
            options:
              - label: "local-path"
                value: "local-path"
        configuration:
          uiType: text
          path: spec.components.engine.configuration
          fieldParams:
            label: "Advanced configuration"
            defaultValues: |2
                operationProfiling:
                  mode: slowOps
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - configuration
  sectionsOrder:
    - databaseVersion
    - resources
    - advanced
