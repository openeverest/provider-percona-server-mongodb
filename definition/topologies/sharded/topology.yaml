# Sharded cluster topology definition.
# This file defines both the structural topology and its UI rendering.

# Topology configuration: which components are used and their defaults.
# configSchema references a Go type in definition/types/ for custom config fields.
config:
  configSchema: ShardedTopologyConfig
  components:
    engine:
      defaults:
        replicas: 3
    proxy: {}
    configServer: {}
    backupAgent:
      optional: true
    monitoring:
      optional: true

# UI schema: rendering hints for the frontend form.
# Paths reference fields in the Instance CR spec.
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Provide the basic information for your new database.
      components:
        version:
          uiType: select
          path: spec.components.engine.version
          fieldParams:
            label: Database Version
    resources:
      label: Resources
      description: Configure the resources for your sharded cluster.
      components:
        shards:
          uiType: number
          path: spec.topology.config.numShards
          fieldParams:
            label: Number of shards
            defaultValue: 2
        numberOfNodes:
          path: spec.components.engine.replicas
          uiType: number
          fieldParams:
            label: Number of nodes per shard
        nodesResources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.components.engine.resources.requests.cpu
              uiType: number
              fieldParams:
                label: CPU
              validation:
                min: 1
                max: 10
            memory:
              path: spec.components.engine.resources.requests.memory
              uiType: number
              fieldParams:
                label: Memory
              validation:
                min: 1
                max: 10
            disk:
              path: spec.components.engine.storage.size
              uiType: number
              fieldParams:
                label: Disk
              validation:
                min: 10
                max: 100
        numberOfRouters:
          path: spec.components.proxy.replicas
          uiType: number
          fieldParams:
            label: Number of routers
        numberOfConfigServers:
          uiType: number
          path: spec.components.configServer.replicas
          fieldParams:
            label: Number of configuration servers
            defaultValue: 3
      componentsOrder:
      - shards
      - numberOfNodes
      - numberOfConfigServers
  sectionsOrder:
  - basicInfo
  - resources
