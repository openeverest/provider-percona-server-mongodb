# Sharded cluster topology definition.
# This file defines both the structural topology and its UI rendering.

# Topology configuration: which components are used and their defaults.
# parametersSchema references a Go type in definition/types/ for topology parameters.
config:
  parametersSchema: ShardedTopologyParameters
  components:
    engine:
      defaults:
        replicas: 3
      # No service: shards are not exposed directly, clients reach them
      # through mongos, and configureReplsets passes nil for a sharded engine.
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: { minimum: 1 }
          schedulingPolicy:
            # The provider reads only these two off the policy.
            properties:
              affinity: {}
              topologySpreadConstraints: {}
    proxy:
      # mongos routes; it holds no data, so no storage.
      supportedFields:
        properties:
          resources: {}
          replicas: { minimum: 1 }
          schedulingPolicy:
            # The provider reads only these two off the policy.
            properties:
              affinity: {}
              topologySpreadConstraints: {}
          service: {}
    configServer:
      # Internal to the cluster, so no service.
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: { minimum: 1 }
          schedulingPolicy:
            # The provider reads only these two off the policy.
            properties:
              affinity: {}
              topologySpreadConstraints: {}
    backupAgent:
      optional: true
      # Nothing is configurable: the provider hardcodes the PBM sidecar's
      # resources, though PerconaServerMongoDB.spec.backup.resources exposes
      # them. Declaring them would publish a no-op; wiring them is a separate fix.
      supportedFields:
        properties: {}
    monitoring:
      optional: true
      supportedFields:
        properties:
          resources: {}

# UI schema: rendering hints for the frontend form.
# Paths reference fields in the Instance CR spec.
ui:
  sections:
    databaseVersion:
      label: "Database"
      description: "Choose the database version and the credentials of its users."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
        userSecret:
          uiType: secret
          path: spec.userSecretRef.name
          fieldParams:
            label: "Database users"
            definition: user
            helperText: "Leave empty to generate the credentials."
            modes:
              edit:
                readOnly: true
                helperText: "Set when the database is created."
              import:
                helperText: "Use the credentials of the database the backup was taken from."
          # A restore inherits the source instance's credentials.
          modes:
            restore:
              uiType: hidden
          validation:
            modes:
              import:
                required: true
      componentsOrder:
        - version
        - userSecret
    resources:
      label: "Resources"
      description: "Configure the resources your new database will have access to."
      components:
        shards:
          uiType: group
          groupType: accordion
          label: "Shards"
          components:
            # The accordion body does not space its children; a plain group
            # stacks them with the same spacing as elsewhere in the form.
            shardsFields:
              uiType: group
              components:
                numberOfShards:
                  uiType: number
                  path: "spec.topology.parameters.numShards"
                  fieldParams:
                    label: "Nº of shards"
                    defaultValue: 1
                  validation:
                    required: true
                    min: 1
                    int: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.topology.parameters.numShards >= original.spec.topology.parameters.numShards"
                            message: "Number of shards cannot be decreased"
                numberOfNodes:
                  path: "spec.components.engine.replicas"
                  uiType: number
                  fieldParams:
                    label: "Nº of nodes per shard"
                    defaultValue: 3
                  validation:
                    required: true
                    min: 1
                    int: true
                    celExpressions:
                      - celExpr: "spec.components.engine.replicas % 2 == 1"
                        message: "The number of nodes must be odd"
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)"
                            message: "Cannot scale down to a single node"
                nodesResources:
                  uiType: group
                  groupType: line
                  components:
                    cpu:
                      path: "spec.components.engine.resources.limits.cpu"
                      uiType: number
                      fieldParams:
                        label: "CPU"
                        defaultValue: 1
                        step: 1
                      validation:
                        min: 0.6
                        required: true
                    memory:
                      path: "spec.components.engine.resources.limits.memory"
                      uiType: number
                      fieldParams:
                        label: "Memory"
                        defaultValue: 4
                        step: 0.1
                        badge: "Gi"
                        badgeToApi: true
                      validation:
                        min: 0.512
                        required: true
                    disk:
                      path: "spec.components.engine.storage.size"
                      uiType: number
                      fieldParams:
                        label: "Disk"
                        defaultValue: 25
                        badge: "Gi"
                        badgeToApi: true
                      validation:
                        min: 1
                        int: true
                        required: true
                        modes:
                          edit:
                            celExpressions:
                              - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                                message: "Disk size cannot be decreased"
                  componentsOrder:
                    - cpu
                    - memory
                    - disk
                storageClass:
                  uiType: select
                  path: spec.components.engine.storage.storageClass
                  fieldParams:
                    label: "Storage class"
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                  validation:
                    required: true
                  dataSource:
                    provider: storageClasses
              componentsOrder:
                - numberOfShards
                - numberOfNodes
                - nodesResources
                - storageClass
          componentsOrder:
            - shardsFields
        configServers:
          uiType: group
          groupType: accordion
          label: "Config servers"
          components:
            configServersFields:
              uiType: group
              components:
                numberOfConfigServers:
                  uiType: number
                  path: "spec.components.configServer.replicas"
                  fieldParams:
                    label: "Nº of config servers"
                    defaultValue: 3
                  validation:
                    required: true
                    min: 1
                    int: true
                    max: 7
                    celExpressions:
                      - celExpr: "spec.components.configServer.replicas % 2 == 1"
                        message: "The number of config servers must be odd"
                      - celExpr: "!(spec.components.engine.replicas > 1 && spec.components.configServer.replicas == 1)"
                        message: "The number of config servers cannot be 1 if the number of database nodes is greater than 1"
                configServersResources:
                  uiType: group
                  groupType: line
                  components:
                    cpu:
                      path: "spec.components.configServer.resources.limits.cpu"
                      uiType: number
                      fieldParams:
                        label: "CPU"
                        defaultValue: 1
                        step: 1
                      validation:
                        min: 0.6
                        required: true
                    memory:
                      path: "spec.components.configServer.resources.limits.memory"
                      uiType: number
                      fieldParams:
                        label: "Memory"
                        defaultValue: 2
                        step: 0.1
                        badge: "Gi"
                        badgeToApi: true
                      validation:
                        min: 0.512
                        required: true
                    disk:
                      path: "spec.components.configServer.storage.size"
                      uiType: number
                      fieldParams:
                        label: "Disk"
                        # Matches the size the provider falls back to when none is
                        # set, so instances created without it keep their volumes.
                        defaultValue: 10
                        badge: "Gi"
                        badgeToApi: true
                      validation:
                        min: 1
                        int: true
                        required: true
                        modes:
                          edit:
                            celExpressions:
                              # Instances created before config server disk was
                              # configurable have no original value to compare.
                              - celExpr: "!has(original.spec.components.configServer.storage.size) || spec.components.configServer.storage.size >= original.spec.components.configServer.storage.size"
                                message: "Disk size cannot be decreased"
                  componentsOrder:
                    - cpu
                    - memory
                    - disk
                storageClass:
                  uiType: select
                  path: spec.components.configServer.storage.storageClass
                  fieldParams:
                    label: "Storage class"
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                  validation:
                    required: true
                  dataSource:
                    provider: storageClasses
              componentsOrder:
                - numberOfConfigServers
                - configServersResources
                - storageClass
          componentsOrder:
            - configServersFields
        routers:
          uiType: group
          groupType: accordion
          label: "Routers"
          components:
            routersFields:
              uiType: group
              components:
                numberOfRouters:
                  path: "spec.components.proxy.replicas"
                  uiType: number
                  fieldParams:
                    label: "Nº of routers"
                    defaultValue: 3
                  validation:
                    required: true
                    min: 1
                    int: true
                    celExpressions:
                      - celExpr: "spec.components.proxy.replicas % 2 == 1"
                        message: "The number of routers must be odd"
                      - celExpr: "spec.components.engine.replicas > 1 ? spec.components.proxy.replicas > 1 : true"
                        message: "Number of routers must be more than 1 if number of nodes is greater than 1"
                routersResources:
                  uiType: group
                  groupType: line
                  components:
                    cpu:
                      path: "spec.components.proxy.resources.limits.cpu"
                      uiType: number
                      fieldParams:
                        label: "CPU"
                        defaultValue: 1
                        step: 1
                      validation:
                        min: 0
                        required: true
                    memory:
                      path: "spec.components.proxy.resources.limits.memory"
                      uiType: number
                      fieldParams:
                        label: "Memory"
                        defaultValue: 2
                        step: 0.1
                        badge: "Gi"
                        badgeToApi: true
                      validation:
                        min: 0
                        required: true
                  componentsOrder:
                    - cpu
                    - memory
              componentsOrder:
                - numberOfRouters
                - routersResources
          componentsOrder:
            - routersFields
      componentsOrder:
        - shards
        - configServers
        - routers
    monitoring:
      label: "Monitoring"
      description: "Monitor the health of your database to detect issues quickly and improve its performance."
      components:
        pmm:
          uiType: group
          groupType: toggleable
          label: "PMM"
          description: "Send metrics and query analytics to Percona Monitoring and Management."
          components:
            monitoringConfig:
              uiType: select
              path: spec.components.monitoring.parameters.monitoringConfigName
              fieldParams:
                label: "PMM server"
              validation:
                required: true
              dataSource:
                provider: monitoringConfigs
          componentsOrder:
            - monitoringConfig
        metrics:
          uiType: group
          groupType: toggleable
          label: "Expose metrics"
          description: "Run mongodb_exporter next to every MongoDB pod to expose metrics in the Prometheus format."
          components:
            prometheus:
              uiType: toggle
              path: spec.components.monitoring.parameters.metrics.prometheus.enabled
              fieldParams:
                label: "Prometheus"
                helperText: "Create a PodMonitor so the Prometheus Operator scrapes the metrics."
            victoriaMetrics:
              uiType: toggle
              path: spec.components.monitoring.parameters.metrics.victoriaMetrics.enabled
              fieldParams:
                label: "VictoriaMetrics"
                helperText: "Create a VMPodScrape so the VictoriaMetrics Operator scrapes the metrics."
          componentsOrder:
            - prometheus
            - victoriaMetrics
      componentsOrder:
        - pmm
        - metrics
    tls:
      label: "TLS"
      description: "Encrypt connections to your database and between its members."
      components:
        mode:
          uiType: select
          path: spec.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            defaultValue: "preferTLS"
            options:
              - label: "Preferred: clients choose whether to use TLS"
                value: "preferTLS"
              - label: "Required: clients must use TLS"
                value: "requireTLS"
          validation:
            required: true
        certificates:
          uiType: group
          groupType: bordered
          label: "Certificates"
          description: "Leave empty to have certificates issued for the instance: by cert-manager when it is installed, otherwise by a CA created for the instance. Can't be changed after the instance is created."
          components:
            certificateSecretName:
              uiType: text
              path: spec.parameters.tls.certificateSecretName
              fieldParams:
                label: "Certificate secret"
                helperText: "Secret with tls.crt, tls.key and ca.crt that clients connect to"
                modes:
                  edit:
                    disabled: true
              validation:
                celExpressions:
                  - celExpr: "!has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '' || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == ''"
                    message: "Use either a certificate secret or an issuer, not both"
            internalCertificateSecretName:
              uiType: text
              path: spec.parameters.tls.internalCertificateSecretName
              fieldParams:
                label: "Internal certificate secret"
                helperText: "For connections between members. Defaults to the certificate secret"
                modes:
                  edit:
                    disabled: true
              validation:
                celExpressions:
                  - celExpr: "!has(spec.parameters.tls.internalCertificateSecretName) || spec.parameters.tls.internalCertificateSecretName == '' || (has(spec.parameters.tls.certificateSecretName) && spec.parameters.tls.certificateSecretName != '')"
                    message: "Set the certificate secret as well"
            issuer:
              uiType: group
              groupType: line
              components:
                issuerName:
                  uiType: text
                  path: spec.parameters.tls.issuer.name
                  fieldParams:
                    label: "cert-manager issuer"
                    helperText: "Issuer that signs the certificates"
                    modes:
                      edit:
                        disabled: true
                issuerKind:
                  uiType: select
                  path: spec.parameters.tls.issuer.kind
                  fieldParams:
                    label: "Issuer kind"
                    defaultValue: "Issuer"
                    options:
                      - label: "Issuer"
                        value: "Issuer"
                      - label: "ClusterIssuer"
                        value: "ClusterIssuer"
                    modes:
                      edit:
                        disabled: true
              componentsOrder:
                - issuerName
                - issuerKind
          componentsOrder:
            - certificateSecretName
            - internalCertificateSecretName
            - issuer
      componentsOrder:
        - mode
        - certificates
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced settings for your database"
      components:
        externalAccess:
          uiType: select
          path: spec.components.proxy.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
            # TODO: Support Service annotation and LoadBalancer source ranges configuration
            # https://github.com/openeverest/openeverest/issues/1959
            # https://github.com/openeverest/openeverest/issues/2398
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "Еngine parameters"
            placeholder: |2
              operationProfiling:
                mode: slowOps
                slowOpThresholdMs: 200
            multiline: true
            minRows: 3
            maxRows: 8
        podSchedulingPolicy:
          uiType: group
          groupType: bordered
          label: "Pod scheduling policy"
          description: "Control how shard, config server and router pods are scheduled onto nodes using affinity rules. Rules replace a component's default, which keeps each shard and config server member on its own node."
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
          componentsOrder:
            - policy
      componentsOrder:
        - configuration
        - podSchedulingPolicy
  sectionsOrder:
    - databaseVersion
    - resources
    - monitoring
    - tls
    - advanced
