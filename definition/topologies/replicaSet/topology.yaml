# Replica Set topology definition.
# This file defines both the structural topology and its UI rendering.

# Topology configuration: which components are used and their defaults.
# Reference a Go type from definition/types/ via configSchema if the
# topology has custom configuration fields.
config:
  components:
    engine:
      defaults:
        replicas: 3
    backupAgent:
      optional: true
    monitoring:
      optional: true

# UI schema: rendering hints for the frontend form.
# Paths reference fields in the Instance CR spec.
ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Provide the information about the database version you want to use."
      components:
        version:
          uiType: select
          path:
            - spec.components.engine.version
            - spec.components.proxy.version
            - spec.components.configServer.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.componentTypes.mongod.versions
            optionsPathConfig:
              labelPath: "version"
              valuePath: "version"
          validation:
            required: true
    resources:
      label: "Resources"
      description: "Configure the resources your new database will have access to."
      components:
        nodes:
          uiType: group
          components:
            numberOfnodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 3
              validation:
                required: true
                min: 1
                int: true
                celExpressions:
                  - celExpr: "spec.components.engine.replicas % 2 == 1"
                    message: "The number of nodes must be odd"
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 0.1
                  validation:
                    min: 0.6
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 4
                    step: 0.001
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.512
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 25
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced settings for your database"
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            defaultValue: "local-path"
            options:
              - label: "local-path"
                value: "local-path"
        configuration:
          uiType: text
          path: spec.components.engine.configuration
          fieldParams:
            label: "Advanced configuration"
            defaultValues: |2
                operationProfiling:
                  mode: slowOps
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - configuration
  sectionsOrder:
    - databaseVersion
    - resources
    - advanced
