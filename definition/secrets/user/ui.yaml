# Create form of the user Secret, opened from the "Database users" field.
# Paths are keys of the Secret's data. An imported backup only opens with the
# credentials of the database it was taken from, so every key is required there.
label: "Database users"
description: "Credentials of the system users the operator creates."
components:
  databaseAdmin:
    uiType: group
    groupType: line
    components:
      user:
        uiType: text
        path: MONGODB_DATABASE_ADMIN_USER
        fieldParams:
          label: "Database admin username"
          defaultValue: databaseAdmin
        validation: &requiredOnImport
          modes:
            import:
              required: true
      password:
        uiType: text
        path: MONGODB_DATABASE_ADMIN_PASSWORD
        fieldParams:
          label: "Database admin password"
          type: password
        validation: *requiredOnImport
    componentsOrder:
      - user
      - password
  userAdmin:
    uiType: group
    groupType: line
    components:
      user:
        uiType: text
        path: MONGODB_USER_ADMIN_USER
        fieldParams:
          label: "User admin username"
          defaultValue: userAdmin
        validation: *requiredOnImport
      password:
        uiType: text
        path: MONGODB_USER_ADMIN_PASSWORD
        fieldParams:
          label: "User admin password"
          type: password
        validation: *requiredOnImport
    componentsOrder:
      - user
      - password
  clusterAdmin:
    uiType: group
    groupType: line
    components:
      user:
        uiType: text
        path: MONGODB_CLUSTER_ADMIN_USER
        fieldParams:
          label: "Cluster admin username"
          defaultValue: clusterAdmin
        validation: *requiredOnImport
      password:
        uiType: text
        path: MONGODB_CLUSTER_ADMIN_PASSWORD
        fieldParams:
          label: "Cluster admin password"
          type: password
        validation: *requiredOnImport
    componentsOrder:
      - user
      - password
  clusterMonitor:
    uiType: group
    groupType: line
    components:
      user:
        uiType: text
        path: MONGODB_CLUSTER_MONITOR_USER
        fieldParams:
          label: "Cluster monitor username"
          defaultValue: clusterMonitor
        validation: *requiredOnImport
      password:
        uiType: text
        path: MONGODB_CLUSTER_MONITOR_PASSWORD
        fieldParams:
          label: "Cluster monitor password"
          type: password
        validation: *requiredOnImport
    componentsOrder:
      - user
      - password
  backup:
    uiType: group
    groupType: line
    components:
      user:
        uiType: text
        path: MONGODB_BACKUP_USER
        fieldParams:
          label: "Backup username"
          defaultValue: backup
        validation: *requiredOnImport
      password:
        uiType: text
        path: MONGODB_BACKUP_PASSWORD
        fieldParams:
          label: "Backup password"
          type: password
        validation: *requiredOnImport
    componentsOrder:
      - user
      - password
componentsOrder:
  - databaseAdmin
  - userAdmin
  - clusterAdmin
  - clusterMonitor
  - backup
