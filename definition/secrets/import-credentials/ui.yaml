# UI rendering hints for the import-credentials secret type.
# Inlined verbatim under spec.secrets["import-credentials"].uiSchema in the
# generated provider spec.
#
# These are the source cluster's PSMDB user credentials, required when importing
# an external PBM backup. Each field maps to a key under the Secret's data.
label: "Import Credentials"
componentsOrder:
  - backupUser
  - backupPassword
  - clusterAdminUser
  - clusterAdminPassword
  - clusterMonitorUser
  - clusterMonitorPassword
  - databaseAdminUser
  - databaseAdminPassword
  - userAdminUser
  - userAdminPassword
components:
  backupUser:
    uiType: text
    path: "data.MONGODB_BACKUP_USER"
    fieldParams:
      label: "Backup User"
    validation:
      required: true
  backupPassword:
    uiType: password
    path: "data.MONGODB_BACKUP_PASSWORD"
    fieldParams:
      label: "Backup Password"
    validation:
      required: true
  clusterAdminUser:
    uiType: text
    path: "data.MONGODB_CLUSTER_ADMIN_USER"
    fieldParams:
      label: "Cluster Admin User"
    validation:
      required: true
  clusterAdminPassword:
    uiType: password
    path: "data.MONGODB_CLUSTER_ADMIN_PASSWORD"
    fieldParams:
      label: "Cluster Admin Password"
    validation:
      required: true
  clusterMonitorUser:
    uiType: text
    path: "data.MONGODB_CLUSTER_MONITOR_USER"
    fieldParams:
      label: "Cluster Monitor User"
    validation:
      required: true
  clusterMonitorPassword:
    uiType: password
    path: "data.MONGODB_CLUSTER_MONITOR_PASSWORD"
    fieldParams:
      label: "Cluster Monitor Password"
    validation:
      required: true
  databaseAdminUser:
    uiType: text
    path: "data.MONGODB_DATABASE_ADMIN_USER"
    fieldParams:
      label: "Database Admin User"
    validation:
      required: true
  databaseAdminPassword:
    uiType: password
    path: "data.MONGODB_DATABASE_ADMIN_PASSWORD"
    fieldParams:
      label: "Database Admin Password"
    validation:
      required: true
  userAdminUser:
    uiType: text
    path: "data.MONGODB_USER_ADMIN_USER"
    fieldParams:
      label: "User Admin User"
    validation:
      required: true
  userAdminPassword:
    uiType: password
    path: "data.MONGODB_USER_ADMIN_PASSWORD"
    fieldParams:
      label: "User Admin Password"
    validation:
      required: true
