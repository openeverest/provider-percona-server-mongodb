# Monitoring contract, published by `provider-sdk generate` as
# Provider.spec.monitoring.
#
# integrations: operator-native integrations rendered in Sync (spec.pmm).
# componentTypes: what each component type from provider.yaml exposes; every
# mongod and mongos pod can run a mongodb_exporter sidecar, and agents can
# connect to each mongod directly with the monitor credential.

integrations:
  pmm:
    agentVersions: ">=3.0.0 <4.0.0"
    authModes: [ServiceAccountToken]
componentTypes:
  mongod:
    kind: mongodb
    metrics: Exporter
    connection: Supported
