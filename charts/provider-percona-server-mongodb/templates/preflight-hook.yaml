# Upgrade preflight: a pre-upgrade hook Job that runs the new provider image
# in preflight mode against the target catalog (delivered via the ConfigMap
# below — the same generated provider-spec.yaml this release applies) and the
# live Instances. A non-zero exit aborts the upgrade before any resource is
# applied. Runs only on `helm upgrade`, never on install.
{{- $operatorVersion := "" }}
{{- range .Chart.Dependencies }}
{{- /* the psmdb-operator dependency is aliased to "operator" */}}
{{- if eq .Name "operator" }}{{- $operatorVersion = .Version }}{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  provider-spec.yaml: |
{{ .Files.Get "generated/provider-spec.yaml" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# Read-only, hook-scoped RBAC: the preflight reads the installed Provider,
# the Instances it manages, and the engine CRs (for provider-specific checks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["core.openeverest.io"]
    resources: ["providers", "instances"]
    verbs: ["get", "list"]
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
subjects:
  - kind: ServiceAccount
    name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "provider-percona-server-mongodb.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
      containers:
        - name: preflight
          image: {{ include "provider-percona-server-mongodb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --preflight-spec=/preflight/provider-spec.yaml
          env:
            # The bundled operator version this release would install; consumed
            # by provider-specific upgrade checks (e.g. the skew-window check).
            - name: TARGET_OPERATOR_VERSION
              value: {{ $operatorVersion | quote }}
          volumeMounts:
            - name: target-spec
              mountPath: /preflight
              readOnly: true
      volumes:
        - name: target-spec
          configMap:
            name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
