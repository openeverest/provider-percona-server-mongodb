# Upgrade preflight: a pre-upgrade hook Job that runs the new provider image
# in preflight mode against the target catalog (delivered via the ConfigMap
# below — the same generated provider-spec.yaml this release applies) and the
# live Instances. A non-zero exit aborts the upgrade before any resource is
# applied. Runs only on `helm upgrade`, never on install.
{{- $operatorVersion := "" }}
{{- range .Chart.Dependencies }}
{{- /* Helm rewrites a dependency's Name to its alias; psmdb-operator is aliased to "operator" */}}
{{- if eq .Name "operator" }}{{- $operatorVersion = .Version }}{{- end }}
{{- end }}
{{- if not $operatorVersion }}{{ fail "preflight-hook: operator dependency not found in .Chart.Dependencies" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  provider-spec.yaml: |
{{ .Files.Get "generated/provider-spec.yaml" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# Read-only, hook-scoped RBAC: the preflight reads the installed Provider,
# the Instances it manages, and the engine CRs (for provider-specific checks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["core.openeverest.io"]
    resources: ["providers", "instances"]
    verbs: ["get", "list"]
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
subjects:
  - kind: ServiceAccount
    name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # Bound unschedulable/unpullable pods so a broken hook fails the upgrade
  # deterministically instead of hanging until the Helm timeout.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        # Deliberately not the shared labels helper: it embeds the Service's
        # selector labels, which must not match a pod that serves nothing.
        helm.sh/chart: {{ include "provider-percona-server-mongodb.chart" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: preflight
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "provider-percona-server-mongodb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --preflight-spec=/preflight/provider-spec.yaml
          env:
            # The bundled operator version this release would install; consumed
            # by provider-specific upgrade checks (e.g. the skew-window check).
            - name: TARGET_OPERATOR_VERSION
              value: {{ $operatorVersion | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: target-spec
              mountPath: /preflight
              readOnly: true
      volumes:
        - name: target-spec
          configMap:
            name: {{ include "provider-percona-server-mongodb.fullname" . }}-preflight
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
