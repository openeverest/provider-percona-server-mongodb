{{- range $preset := .Values.presets }}
{{- if $preset.enabled }}
---
apiVersion: core.openeverest.io/v1alpha1
kind: InstancePreset
metadata:
  name: {{ $preset.name }}-{{ $.Values.provider.shortName }}
  labels:
    {{- include "provider-percona-server-mongodb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: preset
spec:
  {{- toYaml $preset.spec | nindent 2 }}
{{- end }}
{{- end }}
