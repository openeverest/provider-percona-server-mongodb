{{- if and .Values.splitHorizon.tls.caCert .Values.splitHorizon.tls.caKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provider-percona-server-mongodb.fullname" . }}-split-horizon-tls
  labels:
    {{- include "provider-percona-server-mongodb.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.splitHorizon.tls.caCert | b64enc | quote }}
  tls.key: {{ .Values.splitHorizon.tls.caKey | b64enc | quote }}
{{- end }}
