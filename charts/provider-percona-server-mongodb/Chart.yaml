apiVersion: v2
name: provider-percona-server-mongodb
description: A Helm chart for deploying the OpenEverest Percona Server MongoDB provider
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - percona
  - mongodb
  - provider
  - database
home: https://github.com/openeverest/provider-percona-server-mongodb
sources:
  - https://github.com/openeverest/provider-percona-server-mongodb
maintainers:
  - name: OpenEverest Contributors
# TODO: Add openeverest chart as a dependency once it is published.
# For now, OpenEverest (operator + CRDs) must be installed separately before installing this chart.
dependencies:
  - name: psmdb-operator
    alias: operator
    version: "1.22.0"
    repository: https://percona.github.io/percona-helm-charts/
