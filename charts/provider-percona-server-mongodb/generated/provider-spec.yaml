    sharded:
      sections:
        advanced:
          components:
            backupNumParallelCollections:
              fieldParams:
                helperText: Number of collections PBM backs up at once, cluster-wide. Only applies to logical backups; ignored for physical/external. Leave empty for the PBM default (half the backup-agent's CPU count, minimum 1).
                label: Nº of parallel backup collections
              path: spec.components.backupAgent.parameters.numParallelCollections
              uiType: number
              validation:
                int: true
                min: 1
            configuration:
              fieldParams:
                label: Engine parameters
                maxRows: 8
                minRows: 3
                multiline: true
                placeholder: |
                  operationProfiling:
                    mode: slowOps
                    slowOpThresholdMs: 200
              path: spec.components.engine.parameters.configuration
              uiType: text
            oplogSpanMin:
              fieldParams:
                helperText: How often PBM slices the oplog during a logical backup run, cluster-wide. Distinct from a storage's PITR oplog span; falls back to it when left empty.
                label: Backup oplog slicer interval (minutes)
              path: spec.components.backupAgent.parameters.backupOplogSpanMin
              uiType: number
              validation:
                min: 0
            podSchedulingPolicy:
              components:
                policy:
                  uiType: widget
                  widgetType: podSchedulingPolicy
              componentsOrder:
                - policy
              description: Control how shard, config server and router pods are scheduled onto nodes using affinity rules. Rules replace a component's default, which keeps each shard and config server member on its own node.
              groupType: bordered
              label: Pod scheduling policy
              uiType: group
            restoreBatchSize:
              fieldParams:
                helperText: Documents PBM inserts per batch when restoring a logical backup, cluster-wide. Leave empty for the PBM default.
                label: Restore batch size
              path: spec.components.backupAgent.parameters.restoreBatchSize
              uiType: number
              validation:
                int: true
                min: 1
            restoreDownloadChunkMb:
              fieldParams:
                helperText: Chunk size PBM downloads at a time when restoring, cluster-wide. Leave empty for the PBM default.
                label: Restore download chunk size (MiB)
              path: spec.components.backupAgent.parameters.restoreDownloadChunkMb
              uiType: number
              validation:
                int: true
                min: 1
            restoreMaxDownloadBufferMb:
              fieldParams:
                helperText: In-memory download buffer cap PBM uses when restoring, cluster-wide. Leave empty for the PBM default.
                label: Restore max download buffer (MiB)
              path: spec.components.backupAgent.parameters.restoreMaxDownloadBufferMb
              uiType: number
              validation:
                int: true
                min: 1
            restoreNumDownloadWorkers:
              fieldParams:
                helperText: Parallel workers PBM uses to download backup data when restoring, cluster-wide. Leave empty for the PBM default.
                label: Restore download workers
              path: spec.components.backupAgent.parameters.restoreNumDownloadWorkers
              uiType: number
              validation:
                int: true
                min: 1
            restoreNumInsertionWorkers:
              fieldParams:
                helperText: Parallel workers PBM uses to insert documents when restoring a logical backup, cluster-wide. Leave empty for the PBM default.
                label: Restore insertion workers
              path: spec.components.backupAgent.parameters.restoreNumInsertionWorkers
              uiType: number
              validation:
                int: true
                min: 1
            restoreNumParallelCollections:
              fieldParams:
                helperText: Number of collections PBM restores at once, cluster-wide. Only applies when restoring a logical backup; ignored for physical. Leave empty for the PBM default (half the backup-agent's CPU count, minimum 1).
                label: Nº of parallel restore collections
              path: spec.components.backupAgent.parameters.restoreNumParallelCollections
              uiType: number
              validation:
                int: true
                min: 1
          componentsOrder:
            - configuration
            - podSchedulingPolicy
            - backupNumParallelCollections
            - restoreNumParallelCollections
            - oplogSpanMin
            - restoreBatchSize
            - restoreNumInsertionWorkers
            - restoreNumDownloadWorkers
            - restoreMaxDownloadBufferMb
            - restoreDownloadChunkMb
          description: Configure advanced settings for your database
          label: Advanced configuration
        databaseVersion:
          components:
            userSecret:
              fieldParams:
                definition: user
                helperText: Leave empty to generate the credentials.
                label: Database users
                modes:
                  edit:
                    helperText: Set when the database is created.
                    readOnly: true
                  import:
                    helperText: Use the credentials of the database the backup was taken from.
              modes:
                restore:
                  uiType: hidden
              path: spec.userSecretRef.name
              uiType: secret
              validation:
                modes:
                  import:
                    required: true
            version:
              fieldParams:
                label: Database Version
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
                optionsPath: spec.versions
                optionsPathConfig:
                  defaultValuePath: spec.defaultVersion
                  labelPath: name
                  valuePath: name
              path: spec.version
              uiType: select
              validation:
                required: true
          componentsOrder:
            - version
            - userSecret
          description: Choose the database version and the credentials of its users.
          label: Database
        resources:
          components:
            configServers:
              components:
                configServersFields:
                  components:
                    configServersResources:
                      components:
