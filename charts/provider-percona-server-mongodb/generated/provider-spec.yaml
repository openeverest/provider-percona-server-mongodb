                upstream Percona `configuration` field).
              type: string
          type: object
      type: mongod
    hidden:
      type: mongod
    proxy:
      parametersSchema:
        openAPIV3Schema:
          description: MongosParameters defines structured parameters for mongos (proxy) components.
          properties:
            configuration:
              description: |-
                Configuration is the mongos configuration file content (YAML).
                `configuration` is the conventional property name for the engine
                configuration file inside a component's parameters (mirrors the
                upstream Percona `configuration` field).
              type: string
          type: object
      type: mongod
