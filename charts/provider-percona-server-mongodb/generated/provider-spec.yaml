                    helperText: Secret with tls.crt, tls.key and ca.crt that clients connect to
                    label: Certificate secret
                    modes:
                      edit:
                        disabled: true
                  path: spec.parameters.tls.certificateSecretName
                  uiType: text
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '''' || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == '''''
                        message: Use either a certificate secret or an issuer, not both
                internalCertificateSecretName:
                  fieldParams:
                    helperText: For connections between members. Defaults to the certificate secret
                    label: Internal certificate secret
                    modes:
                      edit:
                        disabled: true
                  path: spec.parameters.tls.internalCertificateSecretName
                  uiType: text
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.internalCertificateSecretName) || spec.parameters.tls.internalCertificateSecretName == '''' || (has(spec.parameters.tls.certificateSecretName) && spec.parameters.tls.certificateSecretName != '''')'
                        message: Set the certificate secret as well
                issuer:
                  components:
                    issuerKind:
                      fieldParams:
                        defaultValue: Issuer
                        label: Issuer kind
                        modes:
                          edit:
                            disabled: true
                        options:
                          - label: Issuer
                            value: Issuer
                          - label: ClusterIssuer
                            value: ClusterIssuer
                      path: spec.parameters.tls.issuer.kind
                      uiType: select
                    issuerName:
                      fieldParams:
                        helperText: Issuer that signs the certificates
                        label: cert-manager issuer
                        modes:
                          edit:
                            disabled: true
                      path: spec.parameters.tls.issuer.name
                      uiType: text
                  componentsOrder:
                    - issuerName
                    - issuerKind
                  groupType: line
                  uiType: group
              componentsOrder:
                - certificateSecretName
                - internalCertificateSecretName
                - issuer
              description: 'Leave empty to have certificates issued for the instance: by cert-manager when it is installed, otherwise by a CA created for the instance. Can''t be changed after the instance is created.'
              groupType: bordered
              label: Certificates
              uiType: group
            mode:
              fieldParams:
                defaultValue: preferTLS
                label: TLS mode
                options:
                  - label: 'Preferred: clients choose whether to use TLS'
                    value: preferTLS
                  - label: 'Required: clients must use TLS'
                    value: requireTLS
              path: spec.parameters.tls.mode
              uiType: select
              validation:
                required: true
