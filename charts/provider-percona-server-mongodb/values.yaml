# Default values for provider-percona-server-mongodb.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-percona-server-mongodb
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (health endpoints)
  port: 8082
  # -- The address the metrics endpoint binds to. Use "0" to disable.
  metricsBindAddress: ":8081"

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 1

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 10

# -- Topology spread constraints for pod scheduling
topologySpreadConstraints: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: percona-server-mongodb
  # -- Short identifier for the provider, used in resource names
  # This appears in preset names (e.g., '<shortName>-replicaset') and can be
  # used in other contexts where a short concise provider identifier is needed.
  shortName: psmdb

openeverest:
  # -- Annotations to add to the objects of this chart that OpenEverest
  # interprets: the Provider, its BackupClass and the presets. Keys under
  # openeverest.io/ belong to the chart and to OpenEverest, and are refused.
  annotations: {}
    # For example, to have Argo CD apply these objects before the provider's
    # Deployment and the bundled operator:
    # argocd.argoproj.io/sync-wave: "-1"

# -- Default cluster instance presets configuration
# Each preset must have 'name', 'enabled', and 'spec' fields.
# The 'spec' field contains the full ClusterInstancePresetSpec.
# Note: The provider shortName will be automatically added to each preset name.
presets:
    - name: replicaset
      enabled: true
      spec:
        providerRef:
          name: percona-server-mongodb
        version: 8.0.32
        topology:
          type: replicaSet
        components:
          engine:
            replicas: 3
            resources:
              limits:
                cpu: "1"
                memory: 4Gi
            storage:
              size: 25Gi
              # storageClass: ""  # Specify a storage class if you want to set the default
            schedulingPolicy:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
            service:
              serviceType: ClusterIP
    - name: sharded
      enabled: true
      spec:
        providerRef:
          name: percona-server-mongodb
        version: 8.0.32
        topology:
          type: sharded
          parameters:
            numShards: 2
        components:
          engine:
            replicas: 3
            resources:
              limits:
                cpu: "1"
                memory: 4Gi
            storage:
              size: 25Gi
              # storageClass: ""  # Specify a storage class if you want to set the default
            schedulingPolicy:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
          proxy:
            replicas: 3
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
            schedulingPolicy:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
            service:
              serviceType: ClusterIP
          configServer:
            replicas: 3
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
            storage:
              size: 10Gi
              # storageClass: ""  # Specify a storage class if you want to set the default

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

compatibility:
  acknowledge:
    # -- Install even though the OpenEverest in the cluster does not serve the
    # OpenEverest this chart is built for, which the install otherwise refuses.
    # Set it to the version of OpenEverest the cluster runs, which the error
    # names. It holds on that release and the later ones that keep its
    # contract, such as its patch releases, and expires with the first
    # OpenEverest release that changes the contract, which is checked again.
    # Set ahead of an upgrade, it does nothing until that release is installed.
    coreVersion: ""

# -- Leader election configuration
# TODO: enable configuring leader election in provider.
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# -- Values for the operator subchart.
# See https://github.com/percona/percona-helm-charts/tree/main/charts/psmdb-operator for all options.
operator:
  replicaCount: 1
  rbac:
    create: true
  serviceAccount:
    create: true
  watchAllNamespaces: true
  disableTelemetry: false
  logStructured: false
  logLevel: INFO
